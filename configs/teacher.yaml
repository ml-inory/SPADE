# Teacher training for the built-in synthetic LLM-TTS benchmark.
# ~40 s on an NVIDIA L4; produces a teacher with eval WER ~0.2-0.3.
data:
  num_samples: 3000
  num_eval_samples: 24
  num_speakers: 4
  use_prompt: false
  max_words: 8
  max_len: 192
  seed: 0
model:
  vocab_size: 512
  n_layer: 8
  n_head: 6
  n_embd: 192
  max_position_embeddings: 256
  num_codebooks: 1
batch_size: 32
epochs: 10
lr: 0.001
weight_decay: 0.01
grad_clip: 1.0
device: auto
seed: 0
log_every: 100
