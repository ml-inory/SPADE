# Medium end-to-end demo: ~5-6 min on an NVIDIA L4.
# Expected outcome (synthetic benchmark):
#   teacher WER ~0.27  ->  pruned (4/8 layers) WER ~0.78  ->  distilled WER ~0.15
#   depth x2, params x1.9, RTF x1.9
output_dir: outputs/demo
device: auto
seed: 0
teacher:
  data:
    num_samples: 3000
    num_eval_samples: 24
    num_speakers: 4
    use_prompt: false
    max_words: 8
    max_len: 192
    seed: 0
  model:
    vocab_size: 512
    n_layer: 8
    n_head: 6
    n_embd: 192
    max_position_embeddings: 256
    num_codebooks: 1
  batch_size: 32
  epochs: 10
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 100
prune:
  target_layers: 4
  eval_subset_size: 8
  force_keep_first_last: true
  compute_cli: true
  max_new_tokens: 100
distill:
  data:
    num_samples: 3000
    num_eval_samples: 24
    num_speakers: 4
    use_prompt: false
    max_words: 8
    max_len: 192
    seed: 0
  batch_size: 32
  distill:
    alpha: 0.25
    beta: 0.1
    skew_mode: forward
    use_ce: true
    use_logit: true
    use_latent: true
    use_attention: true
    use_embedding: true
    matching: dynamic
    lr: 0.001
    weight_decay: 0.01
    grad_clip: 1.0
    epochs: 2
    log_every: 100
eval:
  subset_size: 12
  max_new_tokens: 100
  hop_seconds: 0.08
  n_runs: 1
